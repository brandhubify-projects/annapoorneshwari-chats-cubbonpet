<style>
  :root{--ink:#191613;--muted:#6b6258;--paper:#fffaf0;--line:rgba(25,22,19,.14);
        --blue:#163a66;--btn-text:#0e2847;--saffron:#f3b72a;--red:#b73524}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;
       background:linear-gradient(165deg,#17406f 0%,#0e2847 58%,#0b1f38 100%);
       color:#fff;font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
       -webkit-font-smoothing:antialiased}
  .card{width:min(420px,100%);background:rgba(255,255,255,.055);
        border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:34px 30px;
        box-shadow:0 26px 70px rgba(6,16,32,.46)}
  .mark{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
        background:var(--red);color:#ffe29a;font-weight:800;font-size:15px;
        border:2px solid var(--saffron);margin-bottom:20px}
  h1{margin:0 0 8px;font-size:21px;font-weight:700;letter-spacing:-.02em}
  p{margin:0 0 22px;color:rgba(255,255,255,.66);font-size:14px;line-height:1.55}
  label{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;
        text-transform:uppercase;color:var(--saffron);margin-bottom:9px}
  input{width:100%;min-height:46px;padding:12px 14px;border-radius:8px;
        border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);
        color:#fff;font:inherit;font-size:15px}
  input:focus{outline:2px solid var(--saffron);outline-offset:1px}
  button{width:100%;min-height:46px;margin-top:12px;border:0;border-radius:8px;
         background:#fff;color:var(--btn-text);font:inherit;font-weight:700;cursor:pointer}
  button:hover{background:#e8f0fb}
  button[disabled]{opacity:.6;cursor:progress}
  .err{margin-top:14px;font-size:13.5px;color:#ffb4a8;min-height:19px}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);
        font-size:12px;color:rgba(255,255,255,.45)}
</style></head>

<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const err = document.getElementById('err');
const go  = document.getElementById('go');

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  err.textContent = ''; go.disabled = true; go.textContent = 'Unlocking\u2026';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
                   'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(D.s), iterations:D.n, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const packed = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv:b64(D.i) }, key, b64(D.c));

    let html;
    if ('DecompressionStream' in window) {
      const ds = new DecompressionStream('gzip');
      const stream = new Blob([packed]).stream().pipeThrough(ds);
      html = await new Response(stream).text();
    } else {
      throw new Error('This browser is too old to open the preview.');
    }
    document.open(); document.write(html); document.close();
  } catch (ex) {
    go.disabled = false; go.textContent = 'View concepts';
    err.textContent = (ex && ex.message && ex.message.includes('browser'))
      ? ex.message : 'That password did not work. Check it and try again.';
  }
});
</script>
